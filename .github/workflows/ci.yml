# Deterministic verification gates (layer 1 of .github/skills/verification/SKILL.md).
# These checks are the ceiling on agent autonomy: agents iterate on their
# failures, and the branch ruleset requires them before the human merges.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Project quality gate. The repository is docs/planning-only (E0): the
  # docs and scripts ARE the project, so the gate is tuning regression,
  # Markdown path integrity, template sync, and shell hygiene — kept in sync
  # with the "validated commands" section of .github/copilot-instructions.md.
  # Extend when the first real toolchain lands (E1+).
  quality:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
    steps:
      - uses: actions/checkout@v4

      - name: Scaffold tuning regression guard
        run: bash scripts/tuning-status.sh

      - name: Check Markdown path references resolve
        run: bash scripts/check-md-links.sh

      - name: Check issue-form templates stay in sync with body templates
        run: bash scripts/check-template-sync.sh

      - name: Install pinned shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # docs/context/** is excluded: raw intake material must never require
      # edits to keep CI green (same scope as scripts/check-md-links.sh).
      - name: Shellcheck tracked shell scripts
        run: git ls-files -z '*.sh' ':!docs/context/**' | xargs -0 shellcheck -S style

  # Lints the scaffold itself: shell scripts, workflow files, and the
  # consistency of issue-form templates and Markdown path references.
  scaffold-self-check:
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: v0.11.0
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned shellcheck
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version

      # docs/context/** is excluded: raw intake material must never require
      # edits to keep CI green (same scope as scripts/check-md-links.sh).
      - name: Shellcheck all tracked shell scripts
        run: git ls-files -z '*.sh' ':!docs/context/**' | xargs -0 shellcheck -S style

      - name: Install pinned actionlint
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          rm -f actionlint
          actionlint --version

      - name: Actionlint workflow files
        run: actionlint -color

      - name: Check issue-form templates stay in sync with body templates
        run: bash scripts/check-template-sync.sh

      - name: Check Markdown path references resolve
        run: bash scripts/check-md-links.sh
