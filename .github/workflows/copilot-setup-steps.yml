# Pre-installs tools into an ephemeral agent environment so it can verify
# without exploring (kept per decision Q1, #17 — exec:cloud stays reserved).
# Keep in sync with the "validated commands" section of
# .github/copilot-instructions.md and with ci.yml. The job name MUST be
# exactly `copilot-setup-steps`.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/copilot-setup-steps.yml"]
  pull_request:
    paths: [".github/workflows/copilot-setup-steps.yml"]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Docs/scripts toolchain only — the repository is docs/planning-only
      # until the E1+ trees land. Versions mirror the ci.yml pins.
      - name: Install pinned shellcheck and actionlint
        env:
          SHELLCHECK_VERSION: v0.11.0
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${SHELLCHECK_VERSION}"
          shellcheck --version
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          sudo install actionlint /usr/local/bin/actionlint
          rm -f actionlint
          actionlint --version
